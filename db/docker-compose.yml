version: '3.9'

services:

  db:
    image: postgres:alpine
    restart: always
    shm_size: 128mb 
    environment:
      POSTGRES_USER: ignite-pickup-boxes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

volumes:
  pgdata:
