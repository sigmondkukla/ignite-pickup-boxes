services:
  db:
    image: postgres:alpine
    ports:
      - 5432:5432
    restart: always
    shm_size: 128mb 
    environment:
      POSTGRES_USER: ignite-pickup-boxes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ignite-pickup-boxes -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

volumes:
  pgdata:
